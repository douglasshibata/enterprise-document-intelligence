services:
  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: enterprise-doc-intelligence-backend
    working_dir: /app/backend
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    command: mvn spring-boot:run
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: enterprise-doc-intelligence-frontend
    working_dir: /app/frontend
    volumes:
      - .:/app
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --port 4200"
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: enterprise-doc-intelligence-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  maven_repo:
  es_data:
